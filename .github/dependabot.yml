version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "thursday"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "thursday"
    open-pull-requests-limit: 5
    # pyproject uses open >= ranges with no lock file, so Dependabot can't classify an update as
    # minor/patch and update-types matches nothing; group by name instead. These PRs only raise floors.
    groups:
      pip-floors:
        patterns: ["*"]
