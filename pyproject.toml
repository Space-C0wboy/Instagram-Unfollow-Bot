[project]
name = "igcleanup"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "playwright>=1.64.1",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.162.2",
    "uvicorn>=0.54.0",
    "winotify>=1.1; sys_platform == 'win32'",
]

[project.scripts]
igcleanup = "igcleanup.main:main"

[project.optional-dependencies]
dev = ["pytest>=9.2.0", "pytest-asyncio>=1.4.1.post1", "httpx>=0.28.1", "pyinstaller>=6.22.3", "pillow>=13.0.0",
       "ruff==0.17.4"]  # pinned: new ruff releases add rules and would turn CI red unannounced

[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
igcleanup = ["ui/static/*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.format]
exclude = ["*.md"]  # ruff 0.17 also formats code blocks in Markdown; docs keep their own layout

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = [
    "E501",  # line-too-long: the formatter handles length
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["igcleanup.settings.Settings"]  # frozen dataclass, safe as a default

[tool.ruff.lint.isort]
known-first-party = ["igcleanup"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
