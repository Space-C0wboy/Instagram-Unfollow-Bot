[project]
name = "igcleanup"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "playwright>=1.47",
    "beautifulsoup4>=4.12",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "winotify>=1.1; sys_platform == 'win32'",
]

[project.scripts]
igcleanup = "igcleanup.main:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "pyinstaller>=6.10", "pillow>=10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
igcleanup = ["ui/static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
